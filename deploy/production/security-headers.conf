# 基线安全响应头：被 server 块与每个自带 add_header 的 location include。
#
# 为什么必须逐个 include：nginx 的 add_header 不是叠加继承——子级只要定义了自己的
# add_header，父级（含 server 级）定义的所有 add_header 全部失效。因此凡是自建
# add_header 的 location，必须显式 include 本文件，否则会静默丢掉 HSTS 等头。
#
# CSP 不放在这里：HTML 页面与 JSON API 需要不同策略，分别由 location 补充。
# 同样刻意不设 Cross-Origin-Embedder-Policy：require-corp 会阻断未声明 CORP 的
# 第三方资源（Google Fonts、微信头像域名），收益不抵破坏面。

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
