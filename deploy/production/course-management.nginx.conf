# 此文件在 nginx http {} 中 include；与既有站点使用独立的 zone 和日志。
limit_req_zone $binary_remote_addr zone=cm_login_rate:1m rate=10r/m;
limit_conn_zone $server_name zone=cm_login_concurrency:1m;
# 不记录查询参数，避免文件签名凭证落入访问日志。
log_format cm_api '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name course.zsitai.xyz;
    return 301 https://course.zsitai.xyz$request_uri;
}

server {
    listen 443 ssl;
    server_name course.zsitai.xyz;
    ssl_certificate /etc/course-management/course.zsitai.xyz.pem;
    ssl_certificate_key /etc/course-management/course.zsitai.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    server_tokens off;
    root /opt/course-management/admin-web/current;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript;
    access_log /var/log/nginx/course-management-access.log cm_api;
    error_log /var/log/nginx/course-management-error.log warn;
    add_header X-Content-Type-Options nosniff always;

    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /api { return 404; }
    # Argon2 单次需要 64MiB 内存，小规格共享服务器限制同时验证口令的数量。
    location = /api/v1/auth/web/login {
        limit_req zone=cm_login_rate burst=10 nodelay;
        limit_req_status 429;
        limit_conn cm_login_concurrency 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/course-management-proxy.conf;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/course-management-proxy.conf;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/course-management-proxy.conf;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
