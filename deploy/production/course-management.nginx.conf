# 此文件在 nginx http {} 中 include；与既有站点使用独立的 zone 和日志。
#
# server_tokens 放在 http 级：写在 443 的 server 块里不会作用于 80 端口的跳转响应，
# 结果是明文端口回 `Server: nginx/1.18.0 (Ubuntu)`，直接暴露可对照 CVE 的精确版本。
server_tokens off;

# 登录：按 IP 限制每分钟尝试次数，并限制同时进行的 Argon2 校验数（单次约 64MiB）。
limit_req_zone $binary_remote_addr zone=cm_login_rate:1m rate=10r/m;
limit_conn_zone $server_name zone=cm_login_concurrency:1m;
# 其余 API：避免匿名扫描/参数 fuzz 打满单 worker 实例。
limit_req_zone $binary_remote_addr zone=cm_api_rate:10m rate=30r/s;

# 不记录查询参数，避免文件签名凭证落入访问日志。
log_format cm_api '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name course.zsitai.xyz;
    # ACME http-01 校验必须能在明文端口取到 challenge，不能被下面的 301 吞掉。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://course.zsitai.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name course.zsitai.xyz;
    ssl_certificate /etc/course-management/course.zsitai.xyz.pem;
    ssl_certificate_key /etc/course-management/course.zsitai.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 52m;
    root /opt/course-management/admin-web/current;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript;
    access_log /var/log/nginx/course-management-access.log cm_api;
    error_log /var/log/nginx/course-management-error.log warn;

    # 安全头：server 级是默认值，自带 add_header 的 location 需重复 include。
    include /etc/course-management/security-headers.conf;

    # 文档与 schema 关闭：即便应用层配置回退，也不在公网暴露接口定义。
    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /api { return 404; }

    # SPA 对任意未知路径回 index.html（200），会掩盖真实 404 并干扰安全扫描。
    # 敏感前缀直接 404；用负向断言放行 ACME 校验，否则证书续期会失败。
    location ~ ^/(?!\.well-known/)(\.|wp-|backup|config|vendor|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock) {
        return 404;
    }

    # Argon2 单次需要 64MiB 内存，小规格共享服务器限制同时验证口令的数量。
    location = /api/v1/auth/web/login {
        limit_req zone=cm_login_rate burst=10 nodelay;
        limit_req_status 429;
        limit_conn cm_login_concurrency 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8011;
        include /etc/course-management/course-management-proxy.conf;
    }

    include /etc/course-management/file-download.conf;

    location /api/ {
        limit_req zone=cm_api_rate burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8011;
        include /etc/course-management/course-management-proxy.conf;
    }

    # 健康检查不对外暴露运行细节：响应体已精简，这里按需再收紧来源。
    location /health/ {
        limit_req zone=cm_api_rate burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8011;
        include /etc/course-management/course-management-proxy.conf;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        add_header Cache-Control no-store always;
        include /etc/course-management/security-headers.conf;
        # Vue 生产包不需要 eval/inline 脚本；Element Plus 会注入内联样式，
        # 字体来自 Google Fonts，故 style-src/font-src 显式放行对应来源。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/course-management/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
