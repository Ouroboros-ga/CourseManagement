# 仅签名下载允许跨源加载；/access、上传及其他API继续使用同源安全基线。
# URL中的短时HMAC是下载凭证，不依赖Cookie；不允许跨源携带登录凭据。
location ~ ^/api/v1/files/[0-9]+/download$ {
    limit_req zone=cm_api_rate burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8011;
    include /etc/course-management/course-management-proxy.conf;

    # 网关统一输出本路由的CORS和缓存策略，避免应用层CORS配置开启后产生重复头。
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Cache-Control;

    # location中出现add_header会覆盖父级全部同类指令，故完整保留其余安全头。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Cache-Control "private, no-store" always;

    # 预检不读取文件、不核销签名；真正GET仍由应用校验HMAC及有效期。
    # 不声明HEAD支持；当前FastAPI下载路由只提供GET。
    if ($request_method = OPTIONS) {
        return 204;
    }
}
